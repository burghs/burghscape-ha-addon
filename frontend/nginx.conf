server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /static {
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://mybeacon-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Guide files are validated and limited to 20 MiB by the backend. Allow a
    # small amount of multipart framing overhead only on this managed endpoint.
    location ^~ /api/admin/client-guides {
        client_max_body_size 21m;
        proxy_pass http://mybeacon-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api {
        proxy_pass http://mybeacon-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /portal {
        proxy_pass http://mybeacon-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
